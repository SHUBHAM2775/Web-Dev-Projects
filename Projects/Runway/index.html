<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runway - Irregular Income Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <meta name="description" content="Track your irregular income and know your runway instantly.">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Runway</h1>
            <p>Irregular Income Tracker</p>
        </header>

        <section class="dashboard-hero">
            <div class="card balance-card">
                <h2>Current Balance</h2>
                <div class="amount" id="balance-amount">₦0.00</div>
            </div>
            <div class="card runway-card">
                <h2>Runway Left</h2>
                <div class="days" id="runway-days">--</div>
                <div class="subtext">Based on last 14 days</div>
            </div>
        </section>

        <section class="action-section">
            <div class="card action-card">
                <h3>Log Income</h3>
                <form id="income-form">
                    <div class="input-group">
                        <label for="income-amount">Amount</label>
                        <input type="number" id="income-amount" step="0.01" min="0.01" placeholder="0.00" required>
                    </div>
                    <div class="input-group">
                        <label for="income-source">Source / Client</label>
                        <input type="text" id="income-source" placeholder="e.g. Freelance project" required>
                    </div>
                    <div class="input-group">
                        <label for="income-date">Date</label>
                        <input type="date" id="income-date" required>
                    </div>
                    <button type="submit" class="btn primary-btn">Add Income</button>
                </form>
            </div>

            <div class="card action-card">
                <h3>Log Expense</h3>
                <form id="expense-form">
                    <div class="input-group">
                        <label for="expense-amount">Amount</label>
                        <input type="number" id="expense-amount" step="0.01" min="0.01" placeholder="0.00" required>
                    </div>
                    <div class="input-group">
                        <label for="expense-category">Category</label>
                        <select id="expense-category" required>
                            <option value="" disabled selected>Select category...</option>
                            <option value="Rent">Rent</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="expense-date">Date</label>
                        <input type="date" id="expense-date" required>
                    </div>
                    <button type="submit" class="btn danger-btn">Add Expense</button>
                </form>
            </div>
        </section>

        <section class="recent-entries">
            <div class="section-header">
                <h3>Recent Entries</h3>
            </div>
            <div class="entries-list" id="entries-list">
                <!-- Entries will be injected here via JS -->
            </div>
        </section>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal-content card">
            <h3>Edit Entry</h3>
            <form id="edit-form">
                <input type="hidden" id="edit-id">
                <input type="hidden" id="edit-type">
                
                <div class="input-group">
                    <label for="edit-amount">Amount</label>
                    <input type="number" id="edit-amount" step="0.01" min="0.01" required>
                </div>
                
                <div class="input-group" id="edit-source-group">
                    <label for="edit-source">Source / Client</label>
                    <input type="text" id="edit-source">
                </div>
                
                <div class="input-group" id="edit-category-group">
                    <label for="edit-category">Category</label>
                    <select id="edit-category">
                        <option value="Rent">Rent</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label for="edit-date">Date</label>
                    <input type="date" id="edit-date" required>
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="btn secondary-btn" id="cancel-edit">Cancel</button>
                    <button type="submit" class="btn primary-btn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
